version: '3.1'

services:
  mongo:
    image: mongo
    env_file:
      - .envrc
    ports:
      - 27017:27017
    networks:
      - rpn-network
  rpn-api:
    depends_on:
      - mongo
    image: rpn-api
    # build:
    #   context: ..
    #   dockerfile: docker/app.Dockerfile
    ports:
      - 8000:8000
    env_file:
      - .envrc
    networks:
      - rpn-network

networks:
  rpn-network:
    external: true
